name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Run GameTests without optional YUNG mods
        run: ./gradlew -PoptionalYungMods=none runGameTestServer

      - name: Run GameTests with Better Dungeons only
        run: ./gradlew -PoptionalYungMods=betterdungeons runGameTestServer

      - name: Check missing TFC Overdims dependency
        run: |
          ./gradlew -PwithoutTfcOverdims=true -PoptionalYungMods=none runGameTestServer
          grep -F "Mod ID: 'tfcoverdims', Requested by: 'yungsbettertfc', Expected range: '[0.1.4,)', Actual version: '[MISSING]'" run/logs/latest.log
          grep -F 'Mod yungsbettertfc requires tfcoverdims 0.1.4 or above' run/logs/latest.log
