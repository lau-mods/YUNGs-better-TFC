modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Makes YUNG's Better Series structures compatible with TerraFirmaCraft.
'''

[[mixins]]
config="yungsbettertfc.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfc"
type="required"
versionRange="[${tfc_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="yungsapi"
type="required"
versionRange="[1.21.1-NeoForge-5.1.6,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tfcoverdims"
type="required"
versionRange="[0.1.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="betterdungeons"
type="optional"
versionRange="[1.21.1-NeoForge-5.1.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="bettermineshafts"
type="optional"
versionRange="[1.21.1-NeoForge-5.1.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="betterstrongholds"
type="optional"
versionRange="[1.21.1-NeoForge-5.1.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="betteroceanmonuments"
type="optional"
versionRange="[1.21.1-NeoForge-4.1.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="betterfortresses"
type="optional"
versionRange="[1.21.1-NeoForge-3.1.5,)"
ordering="AFTER"
side="BOTH"
